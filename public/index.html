<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard de Tarefas</title>
    
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Dashboard de Tarefas</h1>

   
    <div id="authForm">
        <h2>Login/Registro</h2>
        <form id="userForm">
            <input type="text" id="nome" name="nome" placeholder="Nome" required>
            <input type="email" id="email" name="email" placeholder="Email" required>
            <input type="password" id="senha" name="senha" placeholder="Senha" required>
            <button type="submit">Cadastrar/Login</button>
        </form>
    </div>

    
    <div id="taskArea" style="display: none;">
        <h2>Adicionar Tarefa</h2>
        <form id="taskForm">
            <input type="text" id="titulo" name="titulo" placeholder="Título" required>
            <textarea id="descricao" name="descricao" placeholder="Descrição"></textarea>
            <select id="prioridade" name="prioridade">
                <option value="1">Alta</option>
                <option value="2">Média</option>
                <option value="3">Baixa</option>
            </select>
            <input type="date" id="prazo" name="prazo">
            <button type="submit">Adicionar Tarefa</button>
        </form>

        <div class="task-list" id="taskList">
            
        </div>
    </div>

    
    <script src="js/main.js"></script>
  </body>
</html>
